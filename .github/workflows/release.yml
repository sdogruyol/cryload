name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  spec:
    name: Run specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.1"

      - name: Install dependencies
        run: shards install

      - name: Run specs
        run: crystal spec

  build-binaries:
    name: Build pre-built binary (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    needs: spec
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked fully statically (musl) so they run on
          # any distro regardless of the glibc/OpenSSL versions installed on
          # the user's machine. The build runs in an Alpine container via
          # `docker run` rather than a job container: actions/runner ships no
          # musl Node.js for arm64 (actions/runner#3665), so actions/checkout
          # cannot execute inside an Alpine job container on the arm64 runner.
          - os: ubuntu-latest
            build_container: crystallang/crystal:1.21.1-alpine
            artifact_name: cryload-linux
            binary_path: bin/cryload
          - os: ubuntu-24.04-arm
            build_container: crystallang/crystal:1.21.1-alpine
            artifact_name: cryload-linux-arm64
            binary_path: bin/cryload
          - os: macos-latest
            # OpenSSL is statically linked on macOS (see the step below);
            # -Dstatic_openssl compiles in the same OPENSSL_CONF guard that
            # --static enables for the Linux binaries.
            build_flags: -Dstatic_openssl
            artifact_name: cryload-macos
            binary_path: bin/cryload
          - os: windows-latest
            # Without --static the exe dynamically links Crystal's bundled
            # DLLs (pcre2-8, gc, libssl-3-x64, zlib1, iconv-2, ...) and
            # fails to start on any machine without a Crystal toolchain.
            build_flags: --static
            artifact_name: cryload-windows
            binary_path: bin/cryload.exe
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        if: ${{ !matrix.build_container }}
        with:
          crystal: "1.21.1"

      - name: Install dependencies
        if: ${{ !matrix.build_container }}
        run: shards install

      - name: Link OpenSSL statically (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          OSSL="$(brew --prefix openssl@3)"
          # A directory containing only the static archives; listed first in
          # CRYSTAL_LIBRARY_PATH so the linker picks them over any dylib.
          STATIC="$RUNNER_TEMP/openssl-static"
          mkdir -p "$STATIC"
          cp "$OSSL/lib/libssl.a" "$OSSL/lib/libcrypto.a" "$STATIC/"
          CRYSTAL_LIB="$(crystal env CRYSTAL_LIBRARY_PATH)"
          echo "CRYSTAL_LIBRARY_PATH=$STATIC:$CRYSTAL_LIB" >> "$GITHUB_ENV"
          # Keep the real (unmodified) .pc files discoverable for the stdlib's
          # header and version probes; linking is controlled by the line above.
          echo "PKG_CONFIG_PATH=$OSSL/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Build static release binary (Linux, in Alpine container)
        if: matrix.build_container
        run: |
          docker run --rm -v "$PWD":/src -w /src "${{ matrix.build_container }}" \
            sh -c "apk add -q binutils && shards install && shards build --release --static --no-debug && strip ${{ matrix.binary_path }}"

      - name: Build release binary
        if: ${{ !matrix.build_container }}
        run: shards build --release ${{ matrix.build_flags }}

      - name: Verify binary is statically linked (Linux)
        if: matrix.build_container
        run: |
          file ${{ matrix.binary_path }}
          file ${{ matrix.binary_path }} | grep -q "statically linked"

      - name: Verify only system libraries are linked (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L bin/cryload
          extra="$(otool -L bin/cryload | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/)' || true)"
          if [ -n "$extra" ]; then
            echo "bin/cryload links non-system libraries:" >&2
            echo "$extra" >&2
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  smoke-test:
    name: Smoke test (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.smoke_os }}
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: cryload-linux
            smoke_os: ubuntu-latest
            bin_name: cryload
            python: python3
          - artifact_name: cryload-linux-arm64
            smoke_os: ubuntu-24.04-arm
            bin_name: cryload
            python: python3
          - artifact_name: cryload-macos
            smoke_os: macos-latest
            bin_name: cryload
            python: python3
          # The smoke runner has no Crystal toolchain, so this doubles as a
          # clean-machine test that the exe carries no DLL dependencies
          # beyond the Windows system ones.
          - artifact_name: cryload-windows
            smoke_os: windows-latest
            bin_name: cryload.exe
            python: python
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Verify version and run a short benchmark
        shell: bash
        run: |
          BIN="$PWD/dist/${{ matrix.artifact_name }}/${{ matrix.bin_name }}"
          chmod +x "$BIN"
          "$BIN" --version

          # Bind explicitly to IPv4 loopback and wait until the port accepts
          # connections. A fixed sleep is flaky when the runner is slow.
          ${{ matrix.python }} -m http.server 8765 --bind 127.0.0.1 > /tmp/cryload-smoke-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null --connect-timeout 1 "http://127.0.0.1:8765/"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "HTTP server exited early:" >&2
              cat /tmp/cryload-smoke-http.log >&2 || true
              exit 1
            fi
            sleep 0.1
          done
          curl -sf -o /dev/null --connect-timeout 2 "http://127.0.0.1:8765/" || {
            echo "HTTP server not ready:" >&2
            cat /tmp/cryload-smoke-http.log >&2 || true
            exit 1
          }

          # macOS 15+ GitHub runners enforce Local Network Privacy; unsigned
          # binaries can time out on loopback while system tools (curl) work.
          # Root is exempt from LNP, so use sudo only for the local HTTP probe.
          if [ "${{ runner.os }}" = "macOS" ]; then
            sudo "$BIN" http://127.0.0.1:8765 -n 1 -c 1 --timeout 10 --no-progress --output-format quiet
          else
            "$BIN" http://127.0.0.1:8765 -n 1 -c 1 --timeout 10 --no-progress --output-format quiet
          fi

      - name: Verify HTTPS works (exercises static OpenSSL config/CA paths)
        shell: bash
        run: |
          BIN="$PWD/dist/${{ matrix.artifact_name }}/${{ matrix.bin_name }}"
          "$BIN" https://example.com -n 1 -c 1 --timeout 10 --no-progress --output-format quiet

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [spec, build-binaries, smoke-test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        run: |
          cp dist/cryload-linux/cryload dist/cryload-linux/cryload-linux
          cp dist/cryload-linux-arm64/cryload dist/cryload-linux-arm64/cryload-linux-arm64
          cp dist/cryload-macos/cryload dist/cryload-macos/cryload-macos
          cp dist/cryload-windows/cryload.exe dist/cryload-windows/cryload-windows.exe
          (cd dist/cryload-linux && sha256sum cryload-linux > cryload-linux.sha256)
          (cd dist/cryload-linux-arm64 && sha256sum cryload-linux-arm64 > cryload-linux-arm64.sha256)
          (cd dist/cryload-macos && sha256sum cryload-macos > cryload-macos.sha256)
          (cd dist/cryload-windows && sha256sum cryload-windows.exe > cryload-windows.exe.sha256)

      - name: Build release notes from CHANGELOG
        run: |
          chmod +x scripts/release-notes.sh
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          test -s release-notes.md

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/cryload-linux/cryload-linux
            dist/cryload-linux/cryload-linux.sha256
            dist/cryload-linux-arm64/cryload-linux-arm64
            dist/cryload-linux-arm64/cryload-linux-arm64.sha256
            dist/cryload-macos/cryload-macos
            dist/cryload-macos/cryload-macos.sha256
            dist/cryload-windows/cryload-windows.exe
            dist/cryload-windows/cryload-windows.exe.sha256

  docker-build:
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: smoke-test
    # Publish images only for real release tags; workflow_dispatch runs
    # skip the Docker jobs entirely.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both architectures: Crystal compilation under
          # QEMU emulation is an order of magnitude slower than native.
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dynamic OCI labels (version, revision, created); the static ones
      # live in the Dockerfile.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Prepare platform slug
        id: platform
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # Push by digest only (no tags yet); docker-publish stitches the two
      # digests into a single multi-arch manifest list and tags that.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ steps.platform.outputs.slug }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.platform.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags follow the OCI convention without the v prefix:
      # v5.1.0 -> 5.1.0, 5.1, 5, latest. Prerelease tags (e.g. v5.2.0-rc.1)
      # only get their exact version tag — metadata-action skips the
      # major/minor patterns and :latest for prereleases.
      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create multi-arch manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Word splitting is intentional: the first $() expands to the
          # "-t tag" list, the second to one image@digest per file.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Verify multi-arch manifest
        run: |
          out="$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}")"
          echo "$out"
          for platform in linux/amd64 linux/arm64; do
            echo "$out" | grep -q "Platform: *$platform" || {
              echo "manifest list is missing $platform" >&2
              exit 1
            }
          done

  update-major-tag:
    name: Update moving major tag
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Marketplace convention: `uses: sdogruyol/cryload@v5` tracks the
      # latest v5.x.y release. Only stable semver tags move the major tag;
      # prereleases are skipped. Tag pushes made with GITHUB_TOKEN do not
      # retrigger this workflow, so this cannot loop.
      - name: Force-push major tag
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Skipping major tag update for non-stable tag $tag"
            exit 0
          fi
          major="${tag%%.*}"
          git tag -f "$major" HEAD
          git push -f origin "refs/tags/$major"
